    <body>
        <h1>Space themed game</h1>
<div class="game-container">
    <canvas id="myCanvas" width="1920" height="1080"></canvas>
    <button class="startButton">
        <img id="start-btn" src="https://static.vecteezy.com/system/resources/thumbnails/017/520/181/small/button-for-starting-game-clicking-play-vector.jpg">
    </button>
</script>
</div>
</canvas>
<script>
    
var c = document.getElementById("myCanvas");
var ctx = c.getContext("2d");
ctx.font = "50px Arial";
ctx.strokeText("Escape the sinking Space Ship", 10, 50);
</script>
<script>
var c = document.getElementById("myCanvas");
var ctx = c.getContext("2d");

// Create gradient
var grd = ctx.createLinearGradient(0, 0, 200, 0);
grd.addColorStop(0, "blue");
grd.addColorStop(1, "darkblue");

// Fill with gradient
ctx.fillStyle = grd;
ctx.fillRect(0, 0, 1920, 1080);
</script>
